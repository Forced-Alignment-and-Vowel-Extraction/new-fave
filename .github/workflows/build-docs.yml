name: Build Docs

on:
    push:
        branches: ["main", "dev"]

jobs:
    build-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Install dependencies
              run: |
                sudo apt-get update
                sudo apt-get install libpng-dev           
            - uses: actions/setup-python@v5
              id: setup-python
              with:
                python-version: "3.11"
            - uses: r-lib/actions/setup-r@v2
              name: setup R
              with:
                r-version: "4.4"
            - name: rinstall
              run: |
                R -e 'install.packages(c("png", "rmarkdown", "knitr", "reticulate", "gt", "tibble"))'
            - name: Install uv
              uses: astral-sh/setup-uv@v7    
              with:
                enable-cache: true                        
            - name: Install project
              run: uv sync --group docs
            - name: Run quartodoc build
              run: |
                cd docs
                uv run quartodoc build
                uv run python objects.py
                uv run quartodoc interlinks
            - name: Setup quarto
              uses: quarto-dev/quarto-actions/setup@v2
            - name: Render and publush to gh-pages
              run: |
                git config --global user.email "quarto-github-actions-publish@example.com"
                git config --global user.name "Quarto GHA Workflow Runner"
                uv run quarto publish gh-pages docs --no-browser