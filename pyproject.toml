[project]
name = "new-fave"
version = "1.3.0"
description = "New Vowel Extraction Suite"
authors = [
    {name = "Josef Fruehwald", email = "jofrhwld@gmail.com"}
]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [{include = "new_fave", from="src"}]
homepage = "https://forced-alignment-and-vowel-extraction.github.io/new-fave/"
repository = "https://github.com/Forced-Alignment-and-Vowel-Extraction/new-fave"
requires-python = ">=3.10"
dependencies = [
    "aligned-textgrid>=0.8.1",
    "click>=8.3.1",
    "cloudpickle>=3.1.2",
    "cloup>=3.0.8",
    "fastexcel>=0.19.0",
    "fasttrackpy>=0.6.1",
    "fave-measurement-point>=0.1.5",
    "fave-recode>=0.3.3",
    "librosa>=0.11.0",
    "numpy<=2.2",
    "polars>=1.38.0",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "scipy>=1.15.3",
    "toml>=0.10.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "altair>=6.0.0",
    "hvplot>=0.12.2",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
]
docs = [
    "great-tables>=0.20.0",
    "ipython>=8.38.0",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "quartodoc>=0.11.1",
]
test = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov-config=tests/.coveragerc",
    "--cov-report=xml",
    "--cov",
    "--log-cli-level=CRITICAL"
]
filterwarnings =[
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

pythonpath = "src"
testpaths = "tests"

[project.scripts]
fave-extract = 'new_fave.extract:fave_extract'
